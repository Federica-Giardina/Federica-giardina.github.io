# Hugo configuration — custom lightweight academic theme (layouts/ in this repo).
# No theme modules, Node or Tailwind are needed: the site builds with plain `hugo`.

baseURL: 'https://federica-giardina.github.io/'
title: 'Federica Giardina'
locale: en-US
defaultContentLanguage: en

disableKinds: [taxonomy, term, RSS]
enableRobotsTXT: true
enableGitInfo: false
summaryLength: 30

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

# Talks live in content/events/ but are served at /talks/.
permalinks:
  section:
    events: /talks/

sitemap:
  changeFreq: monthly
