bio: |-
  I am an infectious-disease modeller and biostatistician. I use mathematics and
  statistics to study the evolution and transmission dynamics of infectious
  diseases, with the aim of informing the design of more effective and more
  equitable control interventions in public health.

  My group develops individual-based stochastic models and (Bayesian) spatial
  statistical methods, and applies them to neglected tropical diseases
  (schistosomiasis and soil-transmitted helminths), malaria, HIV and COVID-19.
  A recurring theme is heterogeneity — between hosts, places and socio-economic
  groups — and how it should shape surveillance, trial design and policy.

  I also advise on the Bayesian design and analysis of surveys and clinical
  trials, including N-of-1 trials.

  I am always open to new collaborations in any of these areas — please get
  in touch.

interests:
  - Infectious-disease modelling
  - Bayesian and spatial statistics
  - Simulation-based inference (ABC, emulation)
  - Health inequalities in epidemics
  - Neglected tropical diseases

