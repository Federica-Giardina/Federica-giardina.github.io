name: Federica Giardina
postnominal: PhD
role: Assistant Professor of Biostatistics (tenured)
department: Department for Health Evidence, Biostatistics
affiliation: Radboud University Medical Center, Nijmegen, the Netherlands
affiliation_url: https://www.radboudumc.nl/en/research/research-groups/biostatistics/biostatistics-hev
