tagline: >-
  Mathematical models and Bayesian statistics to make infectious-disease
  control more effective and more equitable.

bio: |-
  I am an infectious-disease modeller and biostatistician. I use mathematics and
  statistics to study the evolution and transmission dynamics of infectious
  diseases, with the aim of informing the design of more effective and more
  equitable control interventions in public health. A recurring theme in my
  work is heterogeneity (between hosts, places and socio-economic groups) and
  how it should shape surveillance, trial design and policy.

  I am always open to new collaborations, so please get in touch.

# Research themes shown as cards on the home page. `link` is optional.
themes:
  - title: Malaria and neglected tropical diseases
    text: >-
      Individual-based transmission models of schistosomiasis, soil-transmitted
      helminths and malaria, used to evaluate control and elimination strategies
      and the WHO 2030 targets.
    link: https://cordis.europa.eu/project/id/846873
    link_text: SchiSTOP project
  - title: Epidemics and health inequalities
    text: >-
      How socio-economic and ethnic inequalities shaped the COVID-19 pandemic in
      the Netherlands, and what equitable epidemic response and preparedness
      should look like.
    link: https://www.pandemicpact.org/grants/P29336
    link_text: EQUalS project
  - title: Surveillance and early warning
    text: >-
      Using routine hospital and general-practice data to detect and respond to
      infectious-disease threats earlier.
    link: https://www.rivm.nl/en/international-projects/united4surveillance
    link_text: United4Surveillance
  - title: Bayesian methods and trial design
    text: >-
      Bayesian spatial statistics, simulation-based inference (ABC, history
      matching and emulation), and Bayesian design and analysis of surveys and
      clinical trials, including N-of-1 trials.
    link: https://doi.org/10.1038/s41467-025-63324-2
    link_text: N-of-1 trials in Parkinson's disease

