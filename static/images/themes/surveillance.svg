<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Hospital and digital health data feeding an AI model that flags an early outbreak signal">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.3" fill="#d2dfeb"/></pattern>
  </defs>
  <rect width="640" height="360" fill="#eaf1f7"/>
  <rect width="640" height="360" fill="url(#dots)"/>

  <!-- data sources: hospital and digital health (phone) -->
  <g transform="translate(52 66)">
    <rect x="0" y="16" width="76" height="62" rx="4" fill="#5480a7"/>
    <path d="M14 16 L38 0 L62 16 Z" fill="#2c3f51"/>
    <rect x="31" y="30" width="14" height="36" fill="#eaf1f7"/>
    <rect x="20" y="41" width="36" height="14" fill="#eaf1f7"/>
  </g>
  <g transform="translate(66 200)">
    <rect x="0" y="0" width="48" height="84" rx="8" fill="#2c3f51"/>
    <rect x="6" y="10" width="36" height="58" rx="2" fill="#c9d9e8"/>
    <polyline points="10,48 18,40 24,52 31,30 38,44" fill="none" stroke="#e07a5f" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="24" cy="76" r="3.5" fill="#eaf1f7"/>
  </g>

  <!-- AI network -->
  <g stroke="#8fb0cf" stroke-width="2">
    <line x1="130" y1="110" x2="196" y2="120"/><line x1="130" y1="110" x2="196" y2="180"/><line x1="130" y1="110" x2="196" y2="240"/>
    <line x1="116" y1="242" x2="196" y2="120"/><line x1="116" y1="242" x2="196" y2="180"/><line x1="116" y1="242" x2="196" y2="240"/>
    <line x1="196" y1="120" x2="252" y2="150"/><line x1="196" y1="120" x2="252" y2="210"/>
    <line x1="196" y1="180" x2="252" y2="150"/><line x1="196" y1="180" x2="252" y2="210"/>
    <line x1="196" y1="240" x2="252" y2="150"/><line x1="196" y1="240" x2="252" y2="210"/>
    <line x1="252" y1="150" x2="300" y2="180"/><line x1="252" y1="210" x2="300" y2="180"/>
  </g>
  <g fill="#5480a7">
    <circle cx="196" cy="120" r="10"/><circle cx="196" cy="180" r="10"/><circle cx="196" cy="240" r="10"/>
    <circle cx="252" cy="150" r="10"/><circle cx="252" cy="210" r="10"/>
  </g>
  <circle cx="300" cy="180" r="12" fill="#2c3f51"/>

  <!-- monitoring signal with alert threshold -->
  <line x1="320" y1="180" x2="335" y2="180" stroke="#2c3f51" stroke-width="3" stroke-linecap="round"/>
  <line x1="340" y1="290" x2="600" y2="290" stroke="#2c3f51" stroke-width="3" stroke-linecap="round"/>
  <line x1="340" y1="290" x2="340" y2="70" stroke="#2c3f51" stroke-width="3" stroke-linecap="round"/>
  <line x1="340" y1="150" x2="600" y2="150" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="8 6"/>
  <polyline points="345,250 365,240 385,255 405,236 425,248 445,232 465,244 485,226 505,236 525,206 545,170 560,120" fill="none" stroke="#5480a7" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="560" cy="120" r="9" fill="#e07a5f"/>
  <circle cx="560" cy="120" r="20" fill="none" stroke="#e07a5f" stroke-width="2.5" opacity="0.6"/>
  <circle cx="560" cy="120" r="32" fill="none" stroke="#e07a5f" stroke-width="2" opacity="0.3"/>
</svg>
