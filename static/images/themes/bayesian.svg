<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="A wide prior updated by data into a narrow posterior, next to randomised N-of-1 treatment periods">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.3" fill="#d2dfeb"/></pattern>
  </defs>
  <rect width="640" height="360" fill="#eaf1f7"/>
  <rect width="640" height="360" fill="url(#dots)"/>

  <!-- prior, data and posterior -->
  <line x1="50" y1="300" x2="390" y2="300" stroke="#2c3f51" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 300 C 110 298, 150 200, 200 200 C 250 200, 290 298, 350 300 Z" fill="#8fb0cf" fill-opacity="0.35" stroke="#8fb0cf" stroke-width="3.5"/>
  <path d="M190 300 C 215 298, 230 80, 255 80 C 280 80, 295 298, 320 300 Z" fill="#5480a7" fill-opacity="0.35" stroke="#2c3f51" stroke-width="3.5"/>
  <g fill="#e07a5f">
    <circle cx="228" cy="300" r="6"/><circle cx="244" cy="300" r="6"/><circle cx="252" cy="300" r="6"/>
    <circle cx="262" cy="300" r="6"/><circle cx="270" cy="300" r="6"/><circle cx="283" cy="300" r="6"/>
    <circle cx="252" cy="314" r="6"/><circle cx="262" cy="314" r="6"/>
  </g>

  <!-- N-of-1 trials: each patient gets randomised treatment (coral) and control (blue) periods -->
  <g transform="translate(420 80)">
    <g>
      <circle cx="14" cy="18" r="11" fill="#2c3f51"/>
      <rect x="36" y="4" width="24" height="28" rx="3" fill="#e07a5f"/><rect x="64" y="4" width="24" height="28" rx="3" fill="#5480a7"/>
      <rect x="92" y="4" width="24" height="28" rx="3" fill="#5480a7"/><rect x="120" y="4" width="24" height="28" rx="3" fill="#e07a5f"/>
      <rect x="148" y="4" width="24" height="28" rx="3" fill="#e07a5f"/>
    </g>
    <g transform="translate(0 52)">
      <circle cx="14" cy="18" r="11" fill="#2c3f51"/>
      <rect x="36" y="4" width="24" height="28" rx="3" fill="#5480a7"/><rect x="64" y="4" width="24" height="28" rx="3" fill="#e07a5f"/>
      <rect x="92" y="4" width="24" height="28" rx="3" fill="#e07a5f"/><rect x="120" y="4" width="24" height="28" rx="3" fill="#5480a7"/>
      <rect x="148" y="4" width="24" height="28" rx="3" fill="#5480a7"/>
    </g>
    <g transform="translate(0 104)">
      <circle cx="14" cy="18" r="11" fill="#2c3f51"/>
      <rect x="36" y="4" width="24" height="28" rx="3" fill="#e07a5f"/><rect x="64" y="4" width="24" height="28" rx="3" fill="#5480a7"/>
      <rect x="92" y="4" width="24" height="28" rx="3" fill="#e07a5f"/><rect x="120" y="4" width="24" height="28" rx="3" fill="#5480a7"/>
      <rect x="148" y="4" width="24" height="28" rx="3" fill="#e07a5f"/>
    </g>
    <g transform="translate(0 156)">
      <circle cx="14" cy="18" r="11" fill="#2c3f51"/>
      <rect x="36" y="4" width="24" height="28" rx="3" fill="#5480a7"/><rect x="64" y="4" width="24" height="28" rx="3" fill="#5480a7"/>
      <rect x="92" y="4" width="24" height="28" rx="3" fill="#e07a5f"/><rect x="120" y="4" width="24" height="28" rx="3" fill="#e07a5f"/>
      <rect x="148" y="4" width="24" height="28" rx="3" fill="#5480a7"/>
    </g>
  </g>
</svg>
