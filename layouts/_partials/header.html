<header class="site-header">
  <div class="wrap header-inner">
    <a class="site-name" href="{{ "/" | relURL }}">{{ hugo.Data.profile.name }}</a>
    <nav aria-label="Main">
      <ul class="nav">
        {{- $current := . }}
        {{- range site.Menus.main }}
        {{- $active := or (and (eq .URL "/") $current.IsHome) (and (ne .URL "/") (strings.HasPrefix $current.RelPermalink .URL)) }}
        <li><a href="{{ .URL | relURL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
