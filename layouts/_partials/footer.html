{{- $p := hugo.Data.profile }}
<footer class="site-footer">
  <div class="wrap footer-inner">
    <p class="footer-icons">
      {{- range $p.links }}
      <a href="{{ .url }}" title="{{ .label }}"><i class="{{ .icon }}" aria-hidden="true"></i><span class="sr-only">{{ .label }}</span></a>
      {{- end }}
    </p>
    <p>{{ $p.name }} · {{ $p.affiliation }}</p>
    <p>© {{ now.Year }} {{ $p.name }}</p>
  </div>
</footer>
